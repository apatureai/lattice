<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-label="lattice: a scene graph that keeps its sources honest">
  <!-- ground -->
  <rect width="1200" height="300" fill="#FFFFFF"/>

  <!-- texture: fine dot grid, 24px pitch, 5% -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#1B1F24"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.05" aria-hidden="true"/>

  <!-- motif: three offset node-grid layers (DOM / a11y / style captures) whose
       matching corner node fuses into one content-addressed node — one hash -->
  <g aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">

    <!-- layer 1 (back) -->
    <rect x="104" y="48" width="120" height="88" rx="8" fill="none" stroke="#D6DCE2" stroke-width="2"/>
    <circle cx="128" cy="64"  r="3.5" fill="#D6DCE2"/>
    <circle cx="168" cy="64"  r="3.5" fill="#D6DCE2"/>
    <circle cx="208" cy="64"  r="3.5" fill="#D6DCE2"/>
    <circle cx="128" cy="94"  r="3.5" fill="#D6DCE2"/>
    <circle cx="168" cy="94"  r="3.5" fill="#D6DCE2"/>
    <circle cx="208" cy="94"  r="3.5" fill="#D6DCE2"/>
    <circle cx="128" cy="124" r="3.5" fill="#D6DCE2"/>
    <circle cx="168" cy="124" r="3.5" fill="#D6DCE2"/>
    <circle cx="208" cy="124" r="3.5" fill="#D6DCE2"/>

    <!-- layer 2 (middle) -->
    <rect x="130" y="76" width="120" height="88" rx="8" fill="none" stroke="#B9C2CB" stroke-width="2"/>
    <circle cx="154" cy="92"  r="3.5" fill="#B9C2CB"/>
    <circle cx="194" cy="92"  r="3.5" fill="#B9C2CB"/>
    <circle cx="234" cy="92"  r="3.5" fill="#B9C2CB"/>
    <circle cx="154" cy="122" r="3.5" fill="#B9C2CB"/>
    <circle cx="194" cy="122" r="3.5" fill="#B9C2CB"/>
    <circle cx="234" cy="122" r="3.5" fill="#B9C2CB"/>
    <circle cx="154" cy="152" r="3.5" fill="#B9C2CB"/>
    <circle cx="194" cy="152" r="3.5" fill="#B9C2CB"/>
    <circle cx="234" cy="152" r="3.5" fill="#B9C2CB"/>

    <!-- layer 3 (front, occludes) -->
    <rect x="156" y="104" width="120" height="88" rx="8" fill="#F6F8FA" stroke="#57606A" stroke-width="2"/>
    <circle cx="180" cy="120" r="3.5" fill="#57606A"/>
    <circle cx="220" cy="120" r="3.5" fill="#57606A"/>
    <circle cx="260" cy="120" r="3.5" fill="#57606A"/>
    <circle cx="180" cy="150" r="3.5" fill="#57606A"/>
    <circle cx="220" cy="150" r="3.5" fill="#57606A"/>
    <circle cx="260" cy="150" r="3.5" fill="#57606A"/>
    <circle cx="180" cy="180" r="3.5" fill="#57606A"/>
    <circle cx="220" cy="180" r="3.5" fill="#57606A"/>

    <!-- fusion: the matching corner node of each layer converges into one node -->
    <path d="M 208 124 L 312 216" fill="none" stroke="#5C7A45" stroke-width="1.5"/>
    <path d="M 234 152 L 312 216" fill="none" stroke="#5C7A45" stroke-width="1.5"/>
    <path d="M 260 180 L 312 216" fill="none" stroke="#5C7A45" stroke-width="1.5"/>

    <!-- the accent (content-addressed) corner node on the front layer -->
    <circle cx="260" cy="180" r="4.5" fill="#5C7A45"/>

    <!-- fused node: one node, one hash -->
    <circle cx="312" cy="216" r="13" fill="#FFFFFF" stroke="#5C7A45" stroke-width="2.5"/>
    <circle cx="312" cy="216" r="4" fill="#5C7A45"/>
  </g>

  <!-- type -->
  <text x="428" y="142"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="600" letter-spacing="-1.5" fill="#1B1F24">lattice</text>
  <rect x="430" y="164" width="96" height="4" rx="2" fill="#5C7A45"/>
  <text x="428" y="210"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" letter-spacing="0.2" fill="#57606A">a scene graph that keeps its sources honest</text>
</svg>
